<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150" fill="none" role="img" aria-label="portfolio — connected repos mark">
  <!--
    Color notes: grayscale, on purpose — black ground, gray edges, gray
    outer nodes, and one node in white marking the hub. Hierarchy reads
    through value (bright vs. dim), not five competing hues, since the
    site's job is being the plain, quiet page that just links out.
  -->
  <rect width="150" height="150" rx="24" fill="#0a0a0f"/>

  <g stroke="#52525b" stroke-width="6" stroke-linecap="round">
    <line x1="47" y1="42" x2="103" y2="42"/>
    <line x1="47" y1="42" x2="75" y2="75"/>
    <line x1="103" y1="42" x2="75" y2="75"/>
    <line x1="75" y1="75" x2="47" y2="108"/>
    <line x1="75" y1="75" x2="103" y2="108"/>
  </g>

  <circle cx="47" cy="42" r="13" fill="#a1a1aa"/>
  <circle cx="103" cy="42" r="13" fill="#a1a1aa"/>
  <circle cx="75" cy="75" r="13" fill="#fafafa"/>
  <circle cx="47" cy="108" r="13" fill="#a1a1aa"/>
  <circle cx="103" cy="108" r="13" fill="#a1a1aa"/>
</svg>
